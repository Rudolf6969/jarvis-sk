# JARVIS SK: len kluce, ktore menime oproti hey-claude. Vsetko ostatne berie hey-claude
# zo svojho config.example.yaml, kde je aj vysvetlenie kazdeho kluca.
# Hodnoty v {{...}} doplni instalator.

# klavesova skratka na hovorenie bez budiaceho slova
app:
  hotkey: ctrl+shift+space

# budiace slovo: hey jarvis (model z projektu openWakeWord)
wake:
  model: hey_jarvis

# prepis reci po slovensky
stt:
  cpu_model: base
  language: sk

# rozhovor a rozhodovanie ide cez claude CLI, teda cez tvoje predplatne, nikdy cez API kluc
fast:
  backend: cli
  cli_model: {{BRAIN}}
  max_tokens: 500

# agent na otazky a ovladanie pocitaca; mapa projektov ide do jeho pokynov
agent:
  model: {{BRAIN}}
  permission_mode: {{AGENT_MODE}}
  filler: Pozriem sa na to.
  extra_args:
  - --append-system-prompt-file
  - C:\JARVIS\PROJEKTY.md

# model na otazky typu: co ta uloha zmenila
conversation:
  task_question_model: {{BRAIN}}

# presna cesta ku claude.exe, doplni instalator
claude:
  exe: {{CLAUDE_EXE}}

# ulohy na pozadi: opravnenia, povolene nastroje, model podla narocnosti (L1 jednoduche, L2 bezna praca a zakony, L3 zlozite)
tasks:
  permission_mode: {{TASKS_MODE}}
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Edit
  - Write
  - Bash(git status:*)
  - Bash(git diff:*)
  - Bash(git log:*)
  - Bash(ls:*)
  - WebSearch
  - WebFetch
  extra_args:
  - --append-system-prompt-file
  - C:\JARVIS\PROJEKTY.md
  default_level: L2
  levels:
    L1:
      model: haiku
    L2: {{L2}}
    L3: {{L3}}

# hovoreny nazov -> priecinok; default = kam ide uloha, ked nepovies kam
projects:
  praca: C:\PRACA
  práca: C:\PRACA
  robota: C:\PRACA
  work: C:\PRACA
  default: C:\PRACA

# slovensky hlas Lukas cez Edge TTS (edge-piper sa tvari ako Piper)
tts:
  engine: piper
  piper_exe: C:\JARVIS\hey-claude\.venv\Scripts\edge-piper.exe
  piper_model: C:\JARVIS\voice\edge-lukas
